name: ci

on:
  push:
    # Every branch here is LIVE work in this repo (`git branch -a`, all four
    # repos agree). They are listed explicitly -- and NOT tidied back to
    # `[master]` -- because each one is a head that pushes were never checked
    # against:
    #
    #   master              the default branch; the weekly drift schedule below
    #                       also runs against it.
    #   feat/packaging      the packaging/allowlist lane; carries the
    #                       package-contents.mjs and allowlists.mjs work that
    #                       this repo exists to police in the consumers.
    #   fix/ci-checkout-order  the sibling-checkout layout lane; its whole
    #                       subject is where projects/* is checked out, which
    #                       is only observable by running the workflow.
    #   ci/github-actions   the checkout@v5 / setup-node@v5 lane.
    #   fix/review-findings the code-review findings lane; the same argument,
    #                       and it is the branch fixes are pushed to.
    #
    # The rule the list follows: a branch is listed while it is being pushed to,
    # and removing one means that branch has merged or been deleted -- not that
    # its CI was inconvenient. A new long-lived branch is added here in the
    # commit that creates it.
    #
    # Before this list, the only push trigger was `master`, so every one of
    # those heads -- each of them clean and fully pushed -- had never produced
    # a single CI run, and a green push could not be distinguished from no CI
    # at all. `pull_request` below covers PR branches, which is why this looked
    # covered: a branch with no PR open is not covered by anything.
    branches:
      - master
      - feat/packaging
      - fix/ci-checkout-order
      - ci/github-actions
      - fix/review-findings
  pull_request:
  schedule:
    # Weekly, against the default branch only. The point of this repo is
    # catching DRIFT between the canonical files here and the copies in the
    # consumer repos; drift has no PR to hang off, because whoever changes the
    # core is not the person who opens a PR in the consumer. A schedule turns
    # that from a silent divergence into a red check.
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: unit tests and typecheck
    runs-on: ubuntu-latest
    steps:
      # THIS REPOSITORY FIRST, ON PURPOSE, AND NOT BY ACCIDENT.
      #
      # actions/checkout runs `clean: true`, which deletes the CONTENTS OF
      # $GITHUB_WORKSPACE before it clones. $GITHUB_WORKSPACE is the default
      # path (an empty `path:`), so with the sibling checkouts already at
      # projects/*, this step wipes every one of them -- and the run then dies
      # a step later with
      #
      #   error: An error occurred trying to start process '/usr/bin/bash'
      #   with working directory '.../projects/pi-manager-core'.
      #   No such file or directory
      #
      # which reads like a checkout that never happened and is actually one
      # that was deleted. Every sibling checkout must therefore come AFTER this
      # step.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  packaging:
    name: packaging allowlists
    runs-on: ubuntu-latest
    # NOT GATED, and that is the change. This used to carry
    #
    #   if: ${{ vars.CONSUMER_REPOS_ENABLED == '1' }}
    #
    # on a repository VARIABLE that nobody has ever set. An unset `vars.*`
    # compares as the empty string, so the condition is false, so the job is
    # skipped, so -- on a push where nothing else fails -- the workflow is
    # GREEN having executed nothing that could have failed. That is the
    # single most dangerous state this suite can be in, because from the run
    # list it is indistinguishable from a passing build.
    #
    # The check does not need the token to be meaningful, so the gate bought
    # nothing and cost the signal. `npm pack --dry-run` packs from the working
    # tree and needs no dependencies, and the CORE half of the run --
    # package-contents.mjs against pi-manager-core itself -- reads package.json
    # and shells out to npm. Both run fine on a runner with no CONSUMER_TOKEN:
    # the three sibling checkouts below simply fail, loudly, and only the
    # checkouts that need a private PAT are gated, per-step.
    #
    # The three consumers are PRIVATE, so the sibling checkouts need the same
    # PAT the consumer job uses: GITHUB_TOKEN cannot read a private repository
    # even in the same org.
    #
    # A SEPARATE job, and not a step in `core`, because of where the checkouts
    # are. The consumers are checked out in the `consumers` job only, so a
    # `files` check added to `core` finds no siblings and -- being written to
    # skip rather than fail when a checkout is absent -- reports
    #
    #   ok pi-manager-core declares a files allowlist (3 entries)
    #   skipped pi-blender (not checked out)
    #   skipped pi-unity-vrchat (not checked out)
    #   skipped pi-unity-blender (not checked out)
    #   1 of 4 package(s) clean, 0 problem(s)
    #
    # which is green and has checked one of the four. That is the failure mode
    # this check exists to prevent, reproduced by the check itself.
    #
    # Its own job also means a packaging problem is reported once, as itself,
    # rather than three times inside three consumer suites.
    steps:
      # THIS REPOSITORY AT projects/pi-manager-core, NOT AT THE WORKSPACE ROOT.
      #
      # test/package-contents.mjs resolves a package as REPO_ROOT/../<name> --
      # the same REPO_ROOT/.. convention resolver-copies.mjs and
      # extension-registration.mjs use, and the layout `consumers` already
      # provides by checking the core out under `projects/`. Checking it out
      # bare here made `..` the workspace root while the siblings sat one level
      # lower, in `projects/`, so the check reported
      #
      #   skipped pi-blender (not checked out)
      #   skipped pi-unity-vrchat (not checked out)
      #   skipped pi-unity-blender (not checked out)
      #   1 of 4 package(s) clean, 0 problem(s)
      #
      # while the logs above it showed three successful clones into
      # projects/pi-blender, projects/pi-unity-vrchat and projects/pi-unity-blender.
      # Green, and looking at one of the four.
      #
      # Being the first checkout also matters: a bare `actions/checkout` runs
      # `clean: true`, which deletes the contents of $GITHUB_WORKSPACE, so it
      # has to precede every path-ed sibling checkout -- and specifying a `path`
      # is what keeps it from doing that.
      - uses: actions/checkout@v5
        with:
          path: projects/pi-manager-core

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Whether the private siblings CAN be fetched is decided ONCE, here, and
      # published as a step output, because `secrets` is not in scope for a
      # step-level `if` either -- the available contexts are env, github,
      # inputs, job, matrix, needs, runner, steps, strategy and vars, so a
      # bare `if: ${{ secrets.X != '' }}` on a step is rejected by the
      # workflow validator outright, exactly as the comment on `consumers`
      # below describes happening at job level. An unset secret arrives as
      # the empty string, which is what the test below asks.
      #
      # This step never fails and never skips: the answer is recorded and
      # consumed by the check and the guard further down.
      #
      # The sibling checkouts are gated on that recorded answer rather than on
      # the secret directly, because a checkout left SKIPPED lets the job
      # carry on to the packaging check, which would then verify only
      # pi-manager-core and report
      #
      #   1 of 4 package(s) clean, 0 problem(s)
      #
      # as a green job -- which is the exact failure this job's comments say
      # it exists to prevent. Gating on one recorded answer keeps the two
      # outcomes cleanly separated: either all three siblings are fetched and
      # all four packages are checked, or none are and the run is red at the
      # guard below.
      - name: can this runner read the private consumer repos?
        id: wired
        env:
          CONSUMER_TOKEN: ${{ secrets.CONSUMER_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${CONSUMER_TOKEN:-}" ]; then
            echo "wired=true" >> "$GITHUB_OUTPUT"
            echo "CONSUMER_TOKEN is set; checking out all three consumers."
          else
            echo "wired=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CONSUMER_TOKEN is not set; the three consumer" \
                 "checkouts and the packaging check will not run."
          fi

      - uses: actions/checkout@v5
        if: steps.wired.outputs.wired == 'true'
        with:
          repository: luxuride-pi-extensions/pi-blender
          path: projects/pi-blender
          ref: master
          token: ${{ secrets.CONSUMER_TOKEN }}

      - uses: actions/checkout@v5
        if: steps.wired.outputs.wired == 'true'
        with:
          repository: luxuride-pi-extensions/pi-unity-vrchat
          path: projects/pi-unity-vrchat
          ref: master
          token: ${{ secrets.CONSUMER_TOKEN }}

      - uses: actions/checkout@v5
        if: steps.wired.outputs.wired == 'true'
        with:
          repository: luxuride-pi-extensions/pi-unity-blender
          path: projects/pi-unity-blender
          ref: master
          token: ${{ secrets.CONSUMER_TOKEN }}

      # No `npm ci` here. The check reads package.json and shells out to
      # `npm pack --dry-run`, which packs from the working tree and needs no
      # dependencies -- and deliberately no installs, because an install would
      # hide the thing being checked: a package whose allowlist omits a
      # directory is exactly a package whose freshly-installed state looks fine.
      #
      # ref: master on the consumers, for the asymmetry reason in `consumers`:
      # the answer being tested is "do the allowlists describe the packages as
      # they are today", which is the question a single repo cannot ask about
      # itself.
      # run from projects/pi-manager-core, so REPO_ROOT/.. is projects/ where
      # the three consumers above were checked out.
      #
      # PI_REQUIRE_PACKAGES=1 because a skip here would be indistinguishable
      # from coverage: this check reported "1 of 4 package(s) clean, 0
      # problem(s)" twice while verifying one package, once from the wrong
      # working directory and once from the wrong checkout layout. With all four
      # expected, an absent one is now a failure.
      #
      # Skipped, rather than run-and-failed, when the runner is unwired: with
      # no token the three siblings are absent, and running the check with
      # PI_REQUIRE_PACKAGES=1 against one of four packages produces a
      # failure whose message is about the checkout layout rather than about
      # packaging. The guard below is
      # where the unwired case is reported, and it reports it as RED.
      #
      # Not `continue-on-error`: on a wired runner this is the whole job, and
      # swallowing a packaging failure would reintroduce exactly the quiet
      # pass this job was ungated to remove. On an unwired runner it never
      # runs, so there is nothing to swallow.
      - name: what each package would publish
        id: packaging_check
        if: steps.wired.outputs.wired == 'true'
        run: node test/package-contents.mjs
        working-directory: projects/pi-manager-core
        env:
          PI_REQUIRE_PACKAGES: "1"

      # The always-on half of the ungating, and the reason this job cannot
      # report green without having verified all four packages. `if: always()`
      # so it runs whichever of the two paths above was taken.
      #
      #   * CONSUMER_TOKEN set -> the four sibling checkouts ran, the check
      #     above is a real result, and its `outcome` must be success. The
      #     outcome is checked rather than the conclusion because a
      #     continue-on-error failure is a failure, not a pass.
      #
      #   * CONSUMER_TOKEN unset -> nothing was verified, so this exits
      #     non-zero and names the missing setup.
      #
      # There is no third state in which this job is green and has not checked
      # all four packages. That is the property the old `vars.*` gate lost:
      # an unset variable used to make this job SKIPPED, which read as a pass.
      - name: all four packages were verified, or this job is red
        if: always()
        env:
          WIRED: ${{ steps.wired.outputs.wired }}
          CHECK_OUTCOME: ${{ steps.packaging_check.outcome }}
        run: |
          set -euo pipefail
          if [ "$WIRED" != "true" ]; then
            echo "::error::CONSUMER_TOKEN is not set, so the three consumer" \
                 "checkouts were skipped and no package was verified."
            echo "CONSUMER_TOKEN is a PAT with read access to the" \
                 "luxuride-pi-extensions org; GITHUB_TOKEN cannot read a" \
                 "private sibling repo. This job is red on purpose: it must" \
                 "never read as passed having checked one of four packages."
            exit 1
          fi
          if [ "$CHECK_OUTCOME" != "success" ]; then
            echo "::error::the packaging check did not pass" \
                 "(outcome: $CHECK_OUTCOME); see the step above."
            exit 1
          fi
          echo "ok all four packages verified"

  consumers:
    name: consumer suites (${{ matrix.repo }})
    # All three consumers are PRIVATE, so this job needs a PAT with read
    # access to the org: GITHUB_TOKEN cannot read a private repository even in
    # the same org.
    #
    # THIS JOB IS NOT GATED, and that is the fix for the worst failure mode in
    # the suite. It used to be:
    #
    #   if: ${{ vars.CONSUMER_REPOS_ENABLED == '1' }}
    #
    # a repository VARIABLE, not a secret, which nobody has ever set. An unset
    # `vars.*` is the empty string, so the condition was false, so every one of
    # these three matrix jobs was SKIPPED -- and a workflow whose every job was
    # skipped reports SUCCESS. From the run list that is indistinguishable
    # from three consumer suites having passed.
    #
    # The variable was chosen over `secrets` for a real reason, kept here
    # because it still constrains the fix: `secrets` is not in scope for a
    # job-level `if` (only github/needs/vars/inputs are), and a bare
    # `if: ${{ secrets.CONSUMER_TOKEN != '' }}` fails the WHOLE workflow file
    # -- zero jobs, which is what the first run of this workflow reported. So
    # the gate cannot simply move to the secret.
    #
    # Ungated, the job runs unconditionally and FAILS on a runner with no
    # CONSUMER_TOKEN, at the guard step below, with a message naming what is
    # missing. That is the shape the brief asks for: a job that cannot do its
    # work is a RED job, never a green one. A matrix job that fails for want of
    # a credential fails on all three legs, which is loud on purpose -- there
    # is no partial configuration in which "some consumers ran" is true.
    needs: core
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Fastest first, so a broken core reports its cheapest consumer before
        # it waits on two installs. No other ordering matters: with every
        # consumer checked out below, each job is independent.
        repo: [pi-blender, pi-unity-blender, pi-unity-vrchat]
    steps:
      # NEITHER checkout can be a bare `uses: actions/checkout@v5` here, and
      # the reason is the same one that kills a bare checkout in the `core` job
      # above. Both of this job's checkouts specify `path: projects/...`, so
      # NEITHER of them is $GITHUB_WORKSPACE -- but a bare checkout as a THIRD
      # step would still be, and its `clean: true` would delete the contents of
      # $GITHUB_WORKSPACE, taking both siblings with it. There is no default
      # checkout in this job, and that is deliberate: two checkouts with
      # explicit paths, and nothing that empties the workspace.
      #
      # The layout itself is load-bearing. resolver-copies.mjs and
      # allowlists.mjs resolve a consumer as REPO_ROOT/../<name>, so the core
      # has to be a SIBLING of the consumer rather than its parent: both live
      # under projects/. See test/consumers.sh, which is what consumes this.
      #
      # FIRST, and before every checkout, the credential this job needs is
      # checked and recorded -- see the long note above on why this job cannot
      # simply be gated on `secrets.CONSUMER_TOKEN`. A step cannot test
      # `secrets` in its `if` either (the validator's available contexts are
      # env, github, inputs, job, matrix, needs, runner, steps, strategy and
      # vars), so the answer is computed once here, into a step output, and
      # every step below reads that.
      #
      # This step cannot fail, and it must not: it exists so that the failure
      # lands on the guard at the end of the job as one clear
      #
      #   CONSUMER_TOKEN is not set, so the consumer suites were not run.
      #
      # rather than as three separate "could not clone a private repository"
      # errors from checkouts that are only incidental.
      - name: can this runner read the private consumer repos?
        id: wired
        env:
          CONSUMER_TOKEN: ${{ secrets.CONSUMER_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${CONSUMER_TOKEN:-}" ]; then
            echo "wired=true" >> "$GITHUB_OUTPUT"
            echo "CONSUMER_TOKEN is set; checking out the core and all three" \
                 "consumers."
          else
            echo "wired=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CONSUMER_TOKEN is not set; every checkout in" \
                 "this job is skipped."
          fi

      - uses: actions/checkout@v5
        if: steps.wired.outputs.wired == 'true'
        with:
          repository: luxuride-pi-extensions/pi-manager-core
          path: projects/pi-manager-core
          # The ref under test: the core checkout must be the thing being
          # pushed (on master, or on a branch push) or the head of the PR,
          # NOT the merge commit. Folded across lines because it is 101
          # columns on one line and a ref that has to be retyped by hand is a
          # ref that eventually tests the wrong commit in silence.
          ref: >-
            ${{ github.ref_name == 'master' && github.sha
            || github.event.pull_request.head.sha }}
          # github.token cannot read a PRIVATE repository. This is the one
          # credential the job needs, and the reason the job is separate from
          # `core` above: this one cannot run on a forked PR, where a token
          # from the fork is what GITHUB_TOKEN would be.
          token: ${{ secrets.CONSUMER_TOKEN }}

      # ALL THREE consumers, in every matrix job, not just the one under test.
      #
      # The obvious reading of the matrix is "check out ${{ matrix.repo }} and
      # run it", and that is what this did -- and two of the three jobs failed
      # for a reason that has nothing to do with the consumer being tested:
      #
      #   consumer suites (pi-unity-vrchat)
      #     Error: Cannot find module '.../extensions/unity-blender/index.ts'
      #   consumer suites (pi-unity-blender)
      #     FAIL no load-failure notice -- a side prompt failed to load
      #     11 passed, 4 failed
      #
      # Both suites need the OTHER consumers beside them. pi-unity-vrchat's
      # engagement-test.mjs imports the binder's index.ts by ABSOLUTE path
      # (test/paths.mjs:153), and pi-unity-blender's manager-prompt.mjs:105
      # reads pi-blender's manager prompt out of $PI_AGENT_DIR/extensions/.
      # test/consumers.sh already links whatever is present and skips the rest,
      # so with one consumer checked out it silently produced a run with no
      # real signal rather than an error.
      #
      # This is the same completeness argument as REQUIRED in
      # extension-registration.mjs: a job that verifies one consumer in
      # isolation is verifying less than it looks like it is. The extra
      # checkouts cost nothing -- no install happens for them, only symlinks
      # and one read of a prompt file.
      #
      # All three at `ref: master`, for the asymmetry reason on the checkout
      # below: the job answers "does the changed core still match the consumers
      # as they are today", not "does it match one of them".
      - uses: actions/checkout@v5
        if: steps.wired.outputs.wired == 'true'
        with:
          repository: luxuride-pi-extensions/pi-blender
          path: projects/pi-blender
          ref: master
          token: ${{ secrets.CONSUMER_TOKEN }}

      - uses: actions/checkout@v5
        if: steps.wired.outputs.wired == 'true'
        with:
          repository: luxuride-pi-extensions/pi-unity-vrchat
          path: projects/pi-unity-vrchat
          ref: master
          token: ${{ secrets.CONSUMER_TOKEN }}

      - uses: actions/checkout@v5
        if: steps.wired.outputs.wired == 'true'
        with:
          repository: luxuride-pi-extensions/pi-unity-blender
          path: projects/pi-unity-blender
          ref: master
          token: ${{ secrets.CONSUMER_TOKEN }}

      - uses: actions/setup-node@v5
        if: steps.wired.outputs.wired == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/pi-manager-core/package-lock.json

      # Installed before the consumers because the core's jiti resolution walks
      # up the tree, and this keeps that from depending on npm's ordering
      # across siblings.
      - name: install the core
        if: steps.wired.outputs.wired == 'true'
        working-directory: projects/pi-manager-core
        run: npm ci

      # Not `continue-on-error`, unlike it might be elsewhere in this file: when
      # this step runs it is the whole job, and swallowing its failure would put
      # back exactly the quiet pass this job was ungated to remove. When it does
      # not run, the guard below is what makes the job red.
      - name: install and test the consumer
        id: suite
        if: steps.wired.outputs.wired == 'true'
        run: projects/pi-manager-core/test/consumers.sh ${{ matrix.repo }}

      # The job cannot be green without having run a consumer suite. This runs
      # on both paths (`if: always()`), and:
      #
      #   * CONSUMER_TOKEN set -> the suite above ran, and its `outcome` must be
      #     success. `outcome` rather than `conclusion` so that a
      #     continue-on-error failure anywhere upstream is read as a failure.
      #
      #   * CONSUMER_TOKEN unset -> no suite ran at all, so this exits non-zero
      #     and names the missing setup.
      #
      # The old gate made the second case render as SKIPPED, i.e. as a pass.
      - name: the consumer suite ran, or this job is red
        if: always()
        env:
          WIRED: ${{ steps.wired.outputs.wired }}
          CONSUMER: ${{ matrix.repo }}
          SUITE_OUTCOME: ${{ steps.suite.outcome }}
        run: |
          set -euo pipefail
          if [ "$WIRED" != "true" ]; then
            echo "::error::CONSUMER_TOKEN is not set, so the consumer suite" \
                 "for $CONSUMER was not run."
            echo "CONSUMER_TOKEN is a PAT with read access to the" \
                 "luxuride-pi-extensions org; GITHUB_TOKEN cannot read a" \
                 "private sibling repo. This job is red on purpose: a green" \
                 "run that checked no consumer must never be possible."
            exit 1
          fi
          if [ "$SUITE_OUTCOME" != "success" ]; then
            echo "::error::the $CONSUMER suite did not pass" \
                 "(outcome: $SUITE_OUTCOME); see the step above."
            exit 1
          fi
          echo "ok $CONSUMER suite ran and passed"
